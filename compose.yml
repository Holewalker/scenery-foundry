name: scenery-foundry

# ADR-0008: caps every service's json-file log driver so logs cannot grow unbounded and fill the
# VPS disk. ~10MiB x 5 files per service (~50MiB), matching ADR-0008's resource table.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# ADR-0008 D11: this file is the DEPLOYABLE BASE — no `backend`/`frontend` app ports are
# published here, because Compose MERGES `ports` lists across files (an overlay can only ADD a
# published port, never remove one). `caddy`, `duckdns`, and `backup` are gated behind
# `profiles: [prod]`, so a plain `docker compose up` (local dev; auto-loads compose.override.yml
# for loopback ports) never starts them, while `docker compose -f compose.yml --profile prod up
# -d` (scripts/deploy.sh) starts every service — the profile-less ones plus the `prod` ones —
# with `-f` explicitly suppressing the override file's auto-load.
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenery_foundry}
      POSTGRES_USER: ${POSTGRES_USER:-scenery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scenery_foundry}
      DATABASE_USER: ${POSTGRES_USER:-scenery}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # ADR-0008: deploy-profile default is secure now that Caddy terminates TLS in front of
      # this container. compose.override.yml flips it back to "false" for plain-HTTP local dev.
      SESSION_COOKIE_SECURE: "true"
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD must be set}
      APP_GEOMETRYJOB_SCHEDULING_ENABLED: "true"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped

  geometry-worker:
    build:
      context: ./geometry-worker
    environment:
      WORKER_DATABASE_URL: postgresql://geometry_worker:${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-scenery_foundry}
      GEOMETRY_DATA_ROOT: /data
      WORKER_LEASE_SECONDS: "120"
      WORKER_HEARTBEAT_SECONDS: "30"
      WORKER_POLL_SECONDS: "2"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Real healthcheck (ADR-0008 D9): liveness-marker freshness (touched every poll cycle,
      # claimed or not) + an independent DB probe. Replaces the previous import-only stub, which
      # would report healthy even if the poll loop had wedged or the DB connection had died.
      test: ["CMD", "python", "-m", "scenery_foundry_worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    # Largest headroom of any service (ADR-0008): mesh work is unbounded relative to input size
    # (ADR-0006 admits up to 5M output triangles), so this is the real memory risk in the stack.
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  # ADR-0008: the single public edge. Terminates TLS on 80/443 (the only published ports in the
  # whole stack), obtains certificates automatically via Caddy's built-in ACME against {$DOMAIN}
  # (kept resolvable by the `duckdns` sidecar, D4), and routes /api/* to backend / everything
  # else to frontend (see Caddyfile) — so /actuator/* is unroutable from the public internet.
  caddy:
    image: caddy:2-alpine
    profiles: [prod]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  # ADR-0008 D4: keeps <DUCKDNS_SUBDOMAIN>.duckdns.org's A record current so Caddy's ACME
  # challenge resolves against a real domain. Same image/shape as the sibling 000Libre project.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: [prod]
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN}
      TOKEN: ${DUCKDNS_TOKEN}
      UPDATE_IP: ipv4
    logging: *default-logging
    mem_limit: 32m
    cpus: 0.1
    restart: unless-stopped

  backup:
    image: postgres:18.4
    profiles: [prod]
    command: ["/scripts/backup/run.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-scenery_foundry}
      POSTGRES_USER: ${POSTGRES_USER:-scenery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DATA_ROOT: /data
      BACKUP_ROOT: /backups
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./scripts/backup:/scripts/backup:ro
      - ./data:/data:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
