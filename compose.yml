name: scenery-foundry

# ADR-0008: caps every service's json-file log driver so logs cannot grow unbounded and fill the
# VPS disk. ~10MiB x 5 files per service (~50MiB), matching ADR-0008's resource table.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenery_foundry}
      POSTGRES_USER: ${POSTGRES_USER:-scenery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenery-local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scenery_foundry}
      DATABASE_USER: ${POSTGRES_USER:-scenery}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-scenery-local}
      SESSION_COOKIE_SECURE: "false"
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD must be set}
      APP_GEOMETRYJOB_SCHEDULING_ENABLED: "true"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  geometry-worker:
    build:
      context: ./geometry-worker
    environment:
      WORKER_DATABASE_URL: postgresql://geometry_worker:${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-scenery_foundry}
      GEOMETRY_DATA_ROOT: /data
      WORKER_LEASE_SECONDS: "120"
      WORKER_HEARTBEAT_SECONDS: "30"
      WORKER_POLL_SECONDS: "2"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Real healthcheck (ADR-0008 D9): liveness-marker freshness (touched every poll cycle,
      # claimed or not) + an independent DB probe. Replaces the previous import-only stub, which
      # would report healthy even if the poll loop had wedged or the DB connection had died.
      test: ["CMD", "python", "-m", "scenery_foundry_worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres-data:
