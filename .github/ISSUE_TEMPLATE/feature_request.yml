name: Feature request
description: Propose an improvement to Scenery Foundry
title: ""
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this change address?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behavior would you like to see?
      placeholder: Describe the desired behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How can we verify that the change is complete?
      placeholder: List observable acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Approval
      description: Confirm the request is ready for implementation.
      options:
        - label: I approve this request for implementation and delivery.
          required: true
