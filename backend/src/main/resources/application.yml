spring:
  application:
    name: scenery-foundry-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scenery_foundry}
    username: ${DATABASE_USER:scenery}
    password: ${DATABASE_PASSWORD:scenery-local}
  flyway:
    enabled: true
    placeholders:
      workerDbPassword: ${WORKER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
# ADR-0008 D8: Spring Boot 4.1's native structured logging, verified against the shipped
# spring-configuration-metadata.json and `CommonStructuredLogFormat` (valid ids: ecs/gelf/logstash).
# Zero new dependencies — no logback-spring.xml/logstash-logback-encoder needed.
logging:
  structured:
    format:
      console: ecs
spring.servlet.multipart:
  max-file-size: 205MB
  max-request-size: 210MB
app:
  scene:
    # ADR-0007 transitional flag: design's PR5 migration sequencing calls for flipping this to
    # true now that PR2a/PR2b shipped a frontend that always sends `version`. NOT flipped in this
    # PR: doing so breaks OwnedSceneMigrationIntegrationTest (7/14 tests fail — confirmed by a
    # real test run), because that @SpringBootTest uses the null-version convenience constructor
    # `new SceneDtos.SceneDto(List.of(...))` at ~15 call sites with no TestPropertySource
    # override. Fixing it means editing backend Java test code, which is out of this PR's
    # explicitly authorized scope (application.yml only). See apply-progress for the follow-up
    # required before this flag can flip. Left at false: zero behavior change from PR4.
    require-version: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
