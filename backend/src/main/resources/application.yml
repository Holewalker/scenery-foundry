spring:
  application:
    name: scenery-foundry-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scenery_foundry}
    username: ${DATABASE_USER:scenery}
    password: ${DATABASE_PASSWORD:scenery-local}
  flyway:
    enabled: true
    placeholders:
      workerDbPassword: ${WORKER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
# ADR-0008 D8: Spring Boot 4.1's native structured logging, verified against the shipped
# spring-configuration-metadata.json and `CommonStructuredLogFormat` (valid ids: ecs/gelf/logstash).
# Zero new dependencies — no logback-spring.xml/logstash-logback-encoder needed.
logging:
  structured:
    format:
      console: ecs
spring.servlet.multipart:
  max-file-size: 205MB
  max-request-size: 210MB
app:
  scene:
    # ADR-0007 transitional flag: flips to true in PR5, once PR2's frontend always sends `version`.
    require-version: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
